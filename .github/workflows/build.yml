name: Build Packages

on: workflow_call

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
      - name: Build Packages
        run: pnpm run build
      - name: Run publint & attw
        run: pnpm run check
