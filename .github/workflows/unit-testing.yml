name: Unit Testing

on: workflow_call

jobs:
  unit-testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [22, 24]
    name: Node.js ${{ matrix.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          node-version: ${{ matrix.version }}
      - name: Run Vitest
        run: pnpm run test
