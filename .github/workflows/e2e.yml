name: E2E Testing

on: workflow_call

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e-testing:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: astro-cache
        env:
          files: >-
            ${{ hashFiles('demos/website/astro.config.ts') }}-${{ hashFiles('demos/website/src/content.config.ts') }}
        with:
          path: |
            demos/website/dist
          key: ${{ runner.os }}-astro-${{ env.files }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-astro-
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
      - name: Build Packages
        run: pnpm run build
      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
      - name: Build Astro site
        run: pnpm run website:build
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
          TRAKT_API_KEY: ${{ secrets.TRAKT_API_KEY }}
      - name: Run Playwright
        run: pnpm run e2e:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ cancelled() || failure() }}
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run-attempt }}
          path: playwright-report/
          retention-days: 1
